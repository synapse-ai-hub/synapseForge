services:
  app:
    build:
      context: .
      args:
        VITE_MODE: prod
        # Set these if the frontend needs to reach the API at a different origin
        # VITE_URL_BASE: "http://localhost:8000"
        # VITE_URL_PROD: "http://localhost:8000"
    ports:
      - "8000:8000"
    restart: unless-stopped
