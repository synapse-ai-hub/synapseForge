<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>synapseForge — Crear RAG</title>
  <link rel="icon" type="image/png" href="/src/assets/logo_empresa.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', system-ui, sans-serif; }
    body { font-size: 15px; line-height: 1.6; color: #374151; background: #f9fafb; }
    .dropzone { transition: all 0.15s ease; }
    .dropzone.dragover { border-color: #6366f1; background: #eef2ff; }
    .file-item { transition: all 0.15s ease; }
  </style>
</head>
<body class="min-h-screen">
  <!-- Header -->
  <header class="bg-white border-b border-gray-200 px-6 py-3 flex items-center gap-3">
    <img src="https://github.com/synapse-ai-hub/sources/raw/main/logo.png"
         alt="Logo" class="h-10 w-auto" onerror="this.style.display='none'">
    <span class="text-lg font-bold text-gray-900">synapseForge</span>
    <span class="text-sm text-gray-400 ml-2">— Crear RAG</span>
  </header>

  <!-- Main -->
  <main class="max-w-2xl mx-auto px-6 py-8 space-y-8">

    <!-- Collection name -->
    <section>
      <label for="collection" class="block text-sm font-medium text-gray-700 mb-1">Nombre de la colección <span class="text-red-500">*</span></label>
      <input type="text" id="collection" name="collection"
             class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent"
             placeholder="Ej: docs-tecnicas, manual-producto">
    </section>

    <!-- File upload -->
    <section>
      <h2 class="text-sm font-medium text-gray-700 mb-2">Archivos</h2>
      <div id="dropzone"
           class="dropzone border-2 border-dashed border-gray-300 rounded-lg p-8 text-center cursor-pointer hover:border-indigo-400">
        <p class="text-sm text-gray-500">Arrastrá archivos acá o <span class="text-indigo-600 font-medium">seleccioná</span></p>
        <p class="text-xs text-gray-400 mt-1">PDF, TXT, MD, DOCX, CSV</p>
        <input type="file" id="fileInput" multiple accept=".pdf,.txt,.md,.docx,.csv" class="hidden">
      </div>
      <ul id="fileList" class="mt-3 space-y-1"></ul>
    </section>

    <!-- URLs -->
    <section>
      <h2 class="text-sm font-medium text-gray-700 mb-2">URLs</h2>
      <div class="flex gap-2">
        <input type="url" id="urlInput"
               class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent"
               placeholder="https://ejemplo.com/documento">
        <button id="addUrlBtn"
                class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium px-4 py-2 rounded-lg transition-colors border border-gray-300">
          Agregar
        </button>
      </div>
      <ul id="urlList" class="mt-3 space-y-1"></ul>
    </section>

    <!-- Submit -->
    <section class="flex items-center gap-3 pt-2">
      <button id="ragSubmit"
              class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-5 py-2.5 rounded-lg transition-colors disabled:opacity-50">
        Crear RAG
      </button>
      <div id="status" class="text-sm text-gray-500 hidden">Trabajando...</div>
    </section>

    <!-- Result -->
    <div id="result" class="hidden p-4 bg-green-50 border border-green-200 rounded-lg">
      <p class="text-sm text-green-800 font-medium">¡Colección RAG creada exitosamente!</p>
      <button onclick="window.close()"
              class="mt-3 text-sm bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg transition-colors">
        Aceptar
      </button>
    </div>
  </main>

  <script>
    // ─── File upload ──────────────────────────────────────────────
    const dropzone = document.getElementById("dropzone");
    const fileInput = document.getElementById("fileInput");
    const fileList = document.getElementById("fileList");
    let selectedFiles = [];

    dropzone.addEventListener("click", () => fileInput.click());
    dropzone.addEventListener("dragover", (e) => { e.preventDefault(); dropzone.classList.add("dragover"); });
    dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragover"));
    dropzone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropzone.classList.remove("dragover");
      addFiles(Array.from(e.dataTransfer.files));
    });
    fileInput.addEventListener("change", () => {
      addFiles(Array.from(fileInput.files));
      fileInput.value = "";
    });

    function addFiles(files) {
      selectedFiles = selectedFiles.concat(files);
      renderFiles();
    }

    function removeFile(index) {
      selectedFiles.splice(index, 1);
      renderFiles();
    }

    function renderFiles() {
      fileList.innerHTML = "";
      selectedFiles.forEach((f, i) => {
        const li = document.createElement("li");
        li.className = "file-item flex items-center gap-2 px-3 py-1.5 bg-white border border-gray-200 rounded-lg text-sm";
        li.innerHTML = `
          <span class="text-indigo-600 font-medium">${f.name}</span>
          <span class="text-gray-400 text-xs">(${(f.size / 1024).toFixed(1)} KB)</span>
          <button onclick="removeFile(${i})" class="ml-auto text-red-500 hover:text-red-700 text-xs font-medium">Quitar</button>
        `;
        fileList.appendChild(li);
      });
    }

    // ─── URLs ─────────────────────────────────────────────────────
    const urlInput = document.getElementById("urlInput");
    const addUrlBtn = document.getElementById("addUrlBtn");
    const urlList = document.getElementById("urlList");
    let urls = [];

    addUrlBtn.addEventListener("click", () => {
      const val = urlInput.value.trim();
      if (!val) return;
      urls.push(val);
      urlInput.value = "";
      renderUrls();
    });
    urlInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); addUrlBtn.click(); }
    });

    function removeUrl(index) {
      urls.splice(index, 1);
      renderUrls();
    }

    function renderUrls() {
      urlList.innerHTML = "";
      urls.forEach((u, i) => {
        const li = document.createElement("li");
        li.className = "flex items-center gap-2 px-3 py-1.5 bg-white border border-gray-200 rounded-lg text-sm";
        li.innerHTML = `
          <span class="text-indigo-600 truncate max-w-md">${u}</span>
          <button onclick="removeUrl(${i})" class="ml-auto text-red-500 hover:text-red-700 text-xs font-medium">Quitar</button>
        `;
        urlList.appendChild(li);
      });
    }

    // ─── Submit ───────────────────────────────────────────────────
    document.getElementById("ragSubmit").addEventListener("click", async () => {
      const status = document.getElementById("status");
      const btn = document.getElementById("ragSubmit");
      const collection = document.getElementById("collection").value.trim();
      if (!collection) { alert("El nombre de la colección es obligatorio."); return; }

      btn.disabled = true;
      status.classList.remove("hidden");
      status.textContent = "Procesando...";

      try {
        // TODO: conectar endpoint POST
        await new Promise(r => setTimeout(r, 2000)); // placeholder
        status.classList.add("hidden");
        document.getElementById("result").classList.remove("hidden");
      } catch (err) {
        status.textContent = "Error: " + err.message;
      }
    });
  </script>
</body>
</html>
