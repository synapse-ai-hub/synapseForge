<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>synapseForge — Crear Skill</title>
  <link rel="icon" type="image/png" href="/src/assets/logo_empresa.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', system-ui, sans-serif; }
    body { font-size: 15px; line-height: 1.6; color: #374151; background: #f9fafb; }
  </style>
</head>
<body class="min-h-screen">
  <!-- Header -->
  <header class="bg-white border-b border-gray-200 px-6 py-3 flex items-center gap-3">
    <img src="https://github.com/synapse-ai-hub/sources/raw/main/logo.png"
         alt="Logo" class="h-10 w-auto" onerror="this.style.display='none'">
    <span class="text-lg font-bold text-gray-900">synapseForge</span>
    <span class="text-sm text-gray-400 ml-2">— Crear Skill</span>
  </header>

  <!-- Main -->
  <main class="max-w-2xl mx-auto px-6 py-8">
    <p class="text-sm text-gray-500 mb-6">Completá los campos para que el asistente genere la skill.</p>

    <form id="skillForm" class="space-y-5">
      <!-- Name -->
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Nombre <span class="text-gray-400">(opcional)</span></label>
        <input type="text" id="name" name="name"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent"
               placeholder="Ej: sql-pro, api-designer">
        <p class="text-xs text-gray-400 mt-1">Si no se indica, el LLM lo infiere automáticamente.</p>
      </div>

      <!-- Task -->
      <div>
        <label for="task" class="block text-sm font-medium text-gray-700 mb-1">¿Para qué tarea es esta skill? <span class="text-red-500">*</span></label>
        <textarea id="task" name="task" rows="4"
                  class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent resize-y"
                  placeholder="Describí la tarea específica que debe resolver, el dominio de conocimiento..."></textarea>
      </div>

      <!-- Triggers -->
      <div>
        <label for="triggers" class="block text-sm font-medium text-gray-700 mb-1">¿Cuándo se debe usar? <span class="text-gray-400">(opcional)</span></label>
        <textarea id="triggers" name="triggers" rows="3"
                  class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent resize-y"
                  placeholder="Palabras clave o frases que activen esta skill. Ej: 'SQL lento', 'optimizar query', 'diseñar schema'..."></textarea>
      </div>

      <!-- Scope -->
      <div>
        <label for="scope" class="block text-sm font-medium text-gray-700 mb-1">Alcance / lo que NO debe hacer <span class="text-gray-400">(opcional)</span></label>
        <textarea id="scope" name="scope" rows="3"
                  class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent resize-y"
                  placeholder="Limitaciones, exclusiones, o temas relacionados que no cubre..."></textarea>
      </div>

      <!-- Submit -->
      <div class="flex items-center gap-3 pt-2">
        <button type="submit"
                class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-5 py-2.5 rounded-lg transition-colors disabled:opacity-50">
          Crear Skill
        </button>
        <div id="status" class="text-sm text-gray-500 hidden">Trabajando...</div>
      </div>
    </form>

    <!-- Result -->
    <div id="result" class="hidden mt-6 p-4 bg-green-50 border border-green-200 rounded-lg">
      <p class="text-sm text-green-800 font-medium">¡Skill creada exitosamente!</p>
      <button onclick="window.close()"
              class="mt-3 text-sm bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg transition-colors">
        Aceptar
      </button>
    </div>
  </main>

  <script>
    document.getElementById("skillForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const status = document.getElementById("status");
      const btn = e.target.querySelector("button[type=submit]");
      btn.disabled = true;
      status.classList.remove("hidden");
      status.textContent = "Trabajando...";

      try {
        // TODO: conectar endpoint POST
        await new Promise(r => setTimeout(r, 1500)); // placeholder
        status.classList.add("hidden");
        document.getElementById("result").classList.remove("hidden");
      } catch (err) {
        status.textContent = "Error: " + err.message;
      }
    });
  </script>
</body>
</html>
