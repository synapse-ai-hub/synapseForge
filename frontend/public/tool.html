<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>synapseForge — Crear Tool</title>
  <link rel="icon" type="image/png" href="/src/assets/logo_empresa.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', system-ui, sans-serif; }
    body { font-size: 15px; line-height: 1.6; color: #374151; background: #f9fafb; }
  </style>
</head>
<body class="min-h-screen">
  <!-- Header (mismo tamaño que docs) -->
  <header style="background: white; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem;">
    <img src="https://github.com/synapse-ai-hub/sources/raw/main/logo.png"
         alt="Logo" style="height: 3rem; width: auto;" onerror="this.style.display='none'">
    <span style="font-size: 1.13rem; font-weight: 700; color: #111827;">synapseForge</span>
    <span style="font-size: 0.875rem; color: #9ca3af; margin-left: 0.5rem;">— Crear Tool</span>
  </header>

  <!-- Main -->
  <main class="max-w-2xl mx-auto px-6 py-8">

    <!-- Explicación -->
    <div class="bg-indigo-50 border border-indigo-100 rounded-lg p-4 mb-6">
      <p class="text-sm text-indigo-900">
        Una <strong>tool</strong> es una función que el asistente puede ejecutar. Le da la capacidad de hacer cosas como leer archivos, buscar en la web, ejecutar código, consultar APIs, etc. Acá vas a describir qué necesitás que haga.
      </p>
    </div>

    <form id="toolForm" class="space-y-5">
      <!-- Nombre -->
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
        <input type="text" id="name" name="name"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent"
               placeholder="Ej: calcular-iva, extraer-pdf">
      </div>

      <!-- Qué hace -->
      <div>
        <label for="purpose" class="block text-sm font-medium text-gray-700 mb-1">¿Qué necesitás que haga? <span class="text-red-500">*</span></label>
        <textarea id="purpose" name="purpose" rows="4"
                  class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent resize-y"
                  placeholder="Describí qué tarea tiene que realizar, qué datos necesita y qué debería devolver. Por ejemplo: 'Dado un número de factura, consulta la API de AFIP y devuelve el detalle de la misma'."></textarea>
      </div>

      <!-- Submit -->
      <div class="flex items-center gap-3 pt-2">
        <button type="submit"
                class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-5 py-2.5 rounded-lg transition-colors disabled:opacity-50">
          Crear Tool
        </button>
        <div id="status" class="text-sm text-gray-500 hidden">Trabajando...</div>
      </div>
    </form>

    <div id="result" class="hidden mt-6 p-4 bg-green-50 border border-green-200 rounded-lg">
      <p class="text-sm text-green-800 font-medium">¡Tool creada exitosamente!</p>
      <button onclick="window.close()"
              class="mt-3 text-sm bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg transition-colors">
        Aceptar
      </button>
    </div>
  </main>

  <script>
    document.getElementById("toolForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const status = document.getElementById("status");
      const btn = e.target.querySelector("button[type=submit]");
      btn.disabled = true;
      status.classList.remove("hidden");
      status.textContent = "Trabajando...";
      try {
        await new Promise(r => setTimeout(r, 1500));
        status.classList.add("hidden");
        document.getElementById("result").classList.remove("hidden");
      } catch (err) {
        status.textContent = "Error: " + err.message;
      }
    });
  </script>
</body>
</html>
