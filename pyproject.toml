[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synapseforge"
version = "0.1.23.dev3"
description = "AI agent project scaffolding & distribution CLI"
readme = "README_PYPI.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
authors = [
    {name = "SYNAPSE AI SAS", email = "developer@synapseaihub.com.ar"}
]
maintainers = [
    {name = "SYNAPSE AI SAS", email = "developer@synapseaihub.com.ar"}
]
keywords = [
    "ai-agents",
    "llm",
    "framework",
    "cli",
    "fastapi",
    "react",
    "mcp",
    "tool-calling"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Init — .ico generation
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.10.0",
    "mypy>=1.15.0",
    "black>=24.0.0",
    "pre-commit>=4.0.0",
]
build = [
    "pyinstaller>=6.0.0",
]

[project.entry-points.console_scripts]
synapseForge = "synapseforge.cli.main:main"

[project.urls]
Homepage = "https://github.com/synapse-ai-hub/synapseForge"
Repository = "https://github.com/synapse-ai-hub/synapseForge"
Issues = "https://github.com/synapse-ai-hub/synapseForge/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["synapseforge*", "pipeline*"]

[tool.setuptools.package-data]
pipeline = ["template.zip", "launch/templates/**/*"]
synapseforge = ["tk/logo.ico"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["synapseforge"]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in default argument
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
enable_error_code = ["ignore-without-code"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

