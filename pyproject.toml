[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synapseforge"
version = "0.1.0"
description = "<descripcion>Nombre del proyecto</descripcion>"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
authors = [
    {name = "<legal>nombre_legal</legal>", email = ""}
]
maintainers = [
    {name = "<owner>nombre_owner</owner>", email = ""}
]
keywords = [
    "ai-agents",
    "llm",
    "framework",
    "cli",
    "fastapi",
    "react",
    "mcp",
    "tool-calling"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Web Framework
    "fastapi>=0.136.0",
    "uvicorn>=0.47.0",
    "pydantic>=2.13.0",
    "starlette>=1.0.0",
    "python-multipart>=0.0.29",
    "anyio>=4.13.0",

    # LLM Providers
    "groq>=1.2.0",
    "ollama>=0.1.0",

    # Data Processing
    "pandas>=3.0.0",
    "numpy>=2.4.0",
    "openpyxl>=3.1.0",

    # File Extraction
    "pdf2image>=1.16.3",
    "pdfminer.six>=20221105",
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "python-docx>=1.1.0",

    # Database
    "sqlalchemy>=2.0.0",
    "pyodbc>=5.1.0",

    # Utilities
    "python-dotenv>=1.2.0",
    "httpx>=0.28.0",
    "PyYAML>=6.0",

    # Web Search
    "duckduckgo-search>=7.0.0",
    "html2text>=2024.2.26",

    # Testing
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",

    # Custom ecosystem
    "synapseTools>=0.1.31",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.10.0",
    "mypy>=1.15.0",
    "black>=24.0.0",
    "pre-commit>=4.0.0",
]
build = [
    "pyinstaller>=6.0.0",
]

[project.entry-points.console_scripts]
synapseforge = "synapseforge.cli.main:app"

[project.urls]
Homepage = "https://github.com/<owner>nombre_owner</owner>/<repo>nombre_repo</repo>"
Repository = "https://github.com/<owner>nombre_owner</owner>/<repo>nombre_repo</repo>"
Issues = "https://github.com/<owner>nombre_owner</owner>/<repo>nombre_repo</repo>/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["synapseforge*"]

[tool.setuptools.package-data]
synapseforge = ["templates/**/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["synapseforge"]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in default argument
]
per-file-ignores = {
    "tests/*": ["S101", "T201"],
}

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
enable_error_code = ["ignore-without-code"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.dynamic]
version = {attr = "synapseforge.__version__"}